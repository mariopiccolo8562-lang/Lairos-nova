name: Prove del ramo aggiorna-senza-conferma

# Controllo del codice, test e una compilazione di prova sul ramo di lavoro (aggiornamento senza conferma, Quiet.kt).
# Stessa preparazione della compilazione su main (flutter create), ma APK debug con firma di anteprima che si butta:
# niente firma vera, niente artefatti, niente release. Prima dell'unione in main si cancella (su main non parte comunque).
on:
  push:
    branches: [aggiorna-senza-conferma]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # come nella compilazione su main: gli avvisi già presenti non fermano, gli errori sì
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Scaffold piattaforme (come su main)
        run: |
          flutter create --org com.kairos --project-name kairos_nova --platforms android .
          sed -i 's/com\.kairos\.kairos_nova/com.kairos.nova/g' android/app/build.gradle.kts
          rm -rf android/app/src/main/kotlin/com/kairos/kairos_nova
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          grep -q "androidx.core:core-ktx" android/app/build.gradle.kts || printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> android/app/build.gradle.kts

      - name: Compilazione di prova (parte nativa)
        run: flutter build apk --debug --target-platform android-arm64

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Rigenera le cartelle di piattaforma mancanti (ios/, android/ parziali)
      # senza toccare i file personalizzati già presenti nel repo.
      - name: Scaffold piattaforme
        run: |
          flutter create --org com.kairos --project-name kairos_nova --platforms android,ios .
          # Allinea namespace/applicationId al nostro id e abilita multidex
          sed -i 's/com\.kairos\.kairos_nova/com.kairos.nova/g' android/app/build.gradle.kts
          sed -i 's/com\.kairos\.kairos_nova/com.kairos.nova/g' android/app/src/main/kotlin/com/kairos/kairos_nova/MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/kairos/nova
          git mv -f android/app/src/main/kotlin/com/kairos/kairos_nova/MainActivity.kt android/app/src/main/kotlin/com/kairos/nova/MainActivity.kt 2>/dev/null || mv android/app/src/main/kotlin/com/kairos/kairos_nova/MainActivity.kt android/app/src/main/kotlin/com/kairos/nova/MainActivity.kt
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          grep -n "namespace\|applicationId\|Sdk" android/app/build.gradle.kts

      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test

      - name: Build APK (release, split per ABI + universal)
        run: flutter build apk --release --split-per-abi

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/KairosNova-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/KairosNova-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      out/KairosNova-x86_64.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: KairosNova-APK
          path: out/*.apk

      - name: Release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kairos Nova — ultima build
          body: |
            Build automatica dal commit ${{ github.sha }}.
            - **KairosNova-arm64.apk** → telefoni/tablet moderni, Android TV recenti, Fire TV 4K
            - **KairosNova-arm32.apk** → box TV e Fire TV Stick vecchi
            - **KairosNova-x86_64.apk** → emulatore / PC
          files: out/*.apk
          prerelease: true

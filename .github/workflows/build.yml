name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Rigenera le cartelle di piattaforma mancanti (ios/, android/ parziali)
      # senza toccare i file personalizzati già presenti nel repo.
      - name: Scaffold piattaforme
        run: |
          flutter create --org com.kairos --project-name kairos_nova --platforms android,ios .
          # Allinea namespace/applicationId al nostro id e abilita multidex
          sed -i 's/com\.kairos\.kairos_nova/com.kairos.nova/g' android/app/build.gradle.kts
          sed -i 's/com\.kairos\.kairos_nova/com.kairos.nova/g' android/app/src/main/kotlin/com/kairos/kairos_nova/MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/kairos/nova
          # la MainActivity (canale nativo per gli aggiornamenti) è nel repo: quella generata si scarta
          rm -rf android/app/src/main/kotlin/com/kairos/kairos_nova
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          # FileProvider per l'installazione degli aggiornamenti
          grep -q "androidx.core:core-ktx" android/app/build.gradle.kts || printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> android/app/build.gradle.kts
          grep -n "namespace\|applicationId\|Sdk" android/app/build.gradle.kts

      # Chiave di firma. Senza una chiave fissa ogni esecuzione firma con una chiave diversa e Android rifiuta
      # l'aggiornamento sopra la versione installata (l'app stessa lo scarta: firma diversa). Serve la chiave
      # definitiva nei segreti del repo: ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD (+ ANDROID_KEY_ALIAS e
      # ANDROID_KEY_PASSWORD se la chiave è stata creata a mano). Mai una chiave dentro al repo: è pubblico.
      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            [ -n "$KS_PASS" ] || { echo "::error::Manca il segreto ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
              || { echo "::error::ANDROID_KEYSTORE_B64 non è copiato per intero: incollalo di nuovo"; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" > /dev/null \
              || { echo "::error::La chiave non si apre: controlla ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firma con la chiave definitiva"
            # il build.gradle.kts è generato da «flutter create»: la firma si aggiunge in coda
            cat >> android/app/build.gradle.kts <<'KTS'

          // Firma Kairos: chiave definitiva dai segreti del repo (percorso in KS_PATH, password/alias nell'ambiente)
          val kxKeystore = System.getenv("KS_PATH")?.takeIf { it.isNotEmpty() }?.let { file(it) }
          if (kxKeystore != null && kxKeystore.exists()) android {
              signingConfigs {
                  create("kairos") {
                      storeFile = kxKeystore
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASS")
                  }
              }
              buildTypes { getByName("release") { signingConfig = signingConfigs.getByName("kairos") } }
          }
          KTS
            tail -n 14 android/app/build.gradle.kts
          else
            echo "::warning::Nessuna chiave di firma nei segreti: l'APK è firmato con una chiave temporanea e NON potrà aggiornare quello installato. Aggiungi ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD in Settings → Secrets → Actions."
          fi

      # Versione: 1.0.<numero di build>, così ogni build è più nuova della precedente e l'app sa aggiornarsi
      - name: Versione
        id: ver
        run: |
          V="1.0.${{ github.run_number }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test

      - name: Build APK (release, split per ABI)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'kairosnova' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.code }}

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/KairosNova-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/KairosNova-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      out/KairosNova-x86_64.apk
          # feed letto dall'app (aggiornamento in background) e dal pannello Kairos
          jq -n --arg v "${{ steps.ver.outputs.version }}" --argjson c ${{ steps.ver.outputs.code }} \
            --arg u "https://github.com/${{ github.repository }}/releases/download/latest/KairosNova-arm64.apk" \
            --arg u32 "https://github.com/${{ github.repository }}/releases/download/latest/KairosNova-arm32.apk" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, versionCode:$c, url:$u, urlArm32:$u32, date:$d}' > out/kairos-nova.json
          cat out/kairos-nova.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: KairosNova-APK
          path: out/*

      - name: Release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kairos Nova — ultima build
          body: |
            Versione ${{ steps.ver.outputs.version }} · build automatica dal commit ${{ github.sha }}.
            - **KairosNova-arm64.apk** → telefoni/tablet moderni, Android TV recenti, Fire TV 4K
            - **KairosNova-arm32.apk** → box TV e Fire TV Stick vecchi
            - **KairosNova-x86_64.apk** → emulatore / PC
          files: out/*
          prerelease: true
